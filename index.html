<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arete Pro</title>
<meta name="description" content="Arete Pro, Taejae Learning Suite: course, program and institution learning outcomes from confirmed rubric ratings.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;family=Marcellus&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
/* sign-in screen (app shell, not an artboard) */
.si{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;box-sizing:border-box;background:#F3F2EF;font-family:Inter,system-ui,sans-serif;color:#111111}
.si-card{width:100%;max-width:400px;background:#FFFFFF;box-shadow:0 0 0 1px #E6E6E6}
.si-h{padding:32px 32px 20px;border-bottom:1px solid #E6E6E6}
.si-brand{display:flex;align-items:center;gap:12px;font-family:Marcellus,Georgia,serif;font-size:25px;letter-spacing:.06em}
.si-h h1{margin:18px 0 0;font-weight:300;font-size:28px;letter-spacing:-0.01em}
.si-h p{margin:6px 0 0;color:#6B6B6B;font-size:14px;line-height:1.5}
.si-f{padding:24px 32px 32px;display:flex;flex-direction:column;gap:16px}
.si-f label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#6B6B6B}
.si-f input{min-height:46px;padding:0 12px;border:1px solid #E6E6E6;background:#FFFFFF;font:inherit;font-size:16px;color:#111111;box-sizing:border-box}
.si-f input:focus{outline:2px solid #502579;outline-offset:-1px}
.si-f button{min-height:46px;border:none;background:#502579;color:#FFFFFF;font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.si-note{margin:0;font-size:12px;color:#6B6B6B}
.si-err{margin:0;min-height:18px;font-size:13px;color:#B42318}
.si-f button[disabled]{opacity:.6;cursor:default}
</style>
<style>
/* loading screen: a slim stepped progress bar, the current step, and a shimmer of the page to come */
.ld{max-width:880px;padding:40px 40px 80px}
.ld-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-family:Inter,system-ui,sans-serif}
.ld-step{font-size:15px;color:#111111;font-weight:500}
.ld-count{font-size:12px;color:#6B6B6B;font-variant-numeric:tabular-nums}
.ld-track{position:relative;height:4px;margin-top:12px;border-radius:4px;background:#EEE9F4;overflow:hidden}
.ld-fill{position:absolute;inset:0 auto 0 0;border-radius:4px;background:linear-gradient(90deg,#502579,#8A5CC2);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.ld-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:ld-sheen 1.2s ease-in-out infinite}
.ld-steps{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;padding:0;list-style:none;font-family:Inter,system-ui,sans-serif;font-size:12px}
.ld-steps li{display:flex;align-items:center;gap:6px;color:#9A9A9A;transition:color .3s}
.ld-steps li.done{color:#502579}
.ld-steps li.now{color:#111111;font-weight:500}
.ld-dot{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex:none}
.ld-steps li.done .ld-dot{background:#502579;box-shadow:none;color:#FFFFFF}
.ld-steps li.now .ld-dot{animation:ld-pulse 1s ease-in-out infinite}
.ld-sk{margin-top:34px;display:grid;gap:12px}
.ld-sk span{display:block;height:14px;border-radius:4px;background:linear-gradient(90deg,#F2F0F5 25%,#E9E4F0 50%,#F2F0F5 75%);background-size:200% 100%;animation:ld-shimmer 1.4s linear infinite}
.ld-sk span.band{height:40px;background-image:linear-gradient(90deg,#3A2156 25%,#4A2C6B 50%,#3A2156 75%)}
@keyframes ld-sheen{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes ld-shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes ld-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.ld-fill,.ld-fill::after,.ld-sk span,.ld-steps li.now .ld-dot{animation:none;transition:none}}
</style>
<style>
/* page columns stay side by side above phone width (nothing wraps under the course column).
   Narrower screens: the course and student columns shrink to codes / first names and open over
   the page on hover or focus. Phones: both become dropdowns at the top. */
.lay,.lay2{flex-wrap:nowrap !important}
.lay-main,.lay2-main{flex:1 1 0 !important;min-width:0}
.dd-bar{display:none;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid #E6E6E6;background:#FAFAF8}
.dd-bar.dd-in{padding:0 0 24px;border:none;background:none}
.dd-l{flex:none;font-size:12px;letter-spacing:.04em;color:#6B6B6B}
.dd{flex:1 1 auto;min-width:0;min-height:40px;padding:0 10px;border:1px solid #CFCFCF;border-radius:0;background:#FFFFFF;font-family:inherit;font-size:14px;color:#111111}
.dd:focus-visible{outline:2px solid #502579;outline-offset:1px}
@media (max-width:1279px){
  .nav{gap:10px 18px !important;font-size:13px !important}
}
@media (max-width:1099px){
  .anon-t{display:none}
  .stu-col{flex:0 0 92px !important;width:92px;max-width:92px !important;position:relative;border-right:none !important}
  .stu-in{position:absolute;top:0;left:0;bottom:0;width:92px;box-sizing:border-box;overflow-x:hidden;overflow-y:auto;z-index:5;background:#FFFFFF;box-shadow:inset -1px 0 0 #E6E6E6;transition:width .15s ease,box-shadow .15s ease}
  .stu-col:hover .stu-in,.stu-col:focus-within .stu-in{width:280px;box-shadow:inset -1px 0 0 #E6E6E6,8px 0 24px rgba(0,0,0,.10)}
  .stu-col:not(:hover):not(:focus-within) .stu-nm,.stu-col:not(:hover):not(:focus-within) .stu-no,.stu-col:not(:hover):not(:focus-within) .stu-note{display:none !important}
  .stu-col:not(:hover):not(:focus-within) .stu-sh{display:block !important}
  .stu-col:not(:hover):not(:focus-within) .stu{padding:9px 14px !important}
  .stu-col:not(:hover):not(:focus-within) .stu-h{padding:0 14px 10px !important;font-size:13px !important}
  .pop-col{flex:0 0 220px !important}
  .lay2-main,.pad{padding-left:24px !important;padding-right:24px !important}
}
@media (max-width:859px){
  .lay,.lay2{flex-direction:column !important}
  .crs,.stu-col{display:none !important}
  .dd-bar{display:flex}
  .pop-col{flex:none !important;border-right:none !important;border-bottom:1px solid #E6E6E6;max-height:260px;overflow-y:auto}
  .lay2-main,.pad{padding-left:16px !important;padding-right:16px !important}
}
</style>
<style id="page-css"></style>
</head>
<body>
<div id="app"></div>

<template id="tpl-signin">
<main class="si">
<div class="si-card">
<div class="si-h">
<div class="si-brand"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 76 76"><rect width="76" height="76" rx="18" fill="#502579"/><polyline points="19,30 26,46 38,52 50,46 57,30" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" fill="none"/><g fill="#fff"><circle cx="19" cy="30" r="3.6"/><circle cx="26" cy="46" r="3.6"/><circle cx="38" cy="52" r="5"/><circle cx="50" cy="46" r="3.6"/><circle cx="57" cy="30" r="3.6"/></g></svg>Arete Pro</div>
<h1>Sign in</h1>
<p>Use your Taejae email and password, the same account as Telos, TaeSylla and Ergon.</p>
</div>
<form class="si-f" id="si-form" onsubmit="ARETE.submitSignIn(event)">
<label>Email<input id="si-email" type="email" autocomplete="username" placeholder="your@taejae.ac.kr" required></label>
<label>Password<input id="si-pw" type="password" autocomplete="current-password" required></label>
<p class="si-err" id="si-err" role="alert"></p>
<button type="submit" id="si-go">Sign in</button>
<p class="si-note">AL0, AL2 and AL3 read live data. The other pages still show the design with sample data.</p>
</form>
</div>
</main>
</template>

<template id="tpl-home">
<div style="font-family: Inter, system-ui, sans-serif; color: #111111; background: #FFFFFF">

<header class="top">
<a href="#home" aria-label="Arete Pro, home" style="display: flex; align-items: center; gap: 12px">
<svg role="img" aria-label="Arete logo: Corona Borealis" width="34" height="34" viewBox="0 0 76 76" style="flex: none"><rect width="76" height="76" rx="18" fill="#502579"></rect><polyline points="19,30 26,46 38,52 50,46 57,30" stroke="#fff" stroke-opacity=".6" stroke-width="2.5" fill="none"></polyline><g fill="#fff"><circle cx="19" cy="30" r="3.6"></circle><circle cx="26" cy="46" r="3.6"></circle><circle cx="38" cy="52" r="5"></circle><circle cx="50" cy="46" r="3.6"></circle><circle cx="57" cy="30" r="3.6"></circle></g></svg>
<span style="font-family: Marcellus, Georgia, serif; font-weight: 400; font-size: 25px; letter-spacing: 0.06em; color: #111111">Arete Pro</span>
</a>
<nav class="nav" aria-label="Main">
<a href="#home" aria-current="page" style="border-bottom-color: #502579; color: #502579; font-weight: 500">Home</a>
<a href="#al0">AL0 Assessment</a>
<a href="#al1">AL1 Student</a>
<a href="#al2">AL2 Course</a>
<a href="#al3">AL3 Program</a>
<a href="#al4">AL4 Institution</a>
<a href="#">About</a>
<a href="#">Settings</a>
</nav>
<button type="button" class="anon-btn" onClick="{{toggleAnon}}" aria-pressed="{{anon}}" title="Show students as S1, S2 … (for demos and screen sharing)" style="{{anonStyle}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7c2.1 0 3.9.7 5.4 1.7M22 12s-3.5 7-10 7c-2.1 0-3.9-.7-5.4-1.7"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path><path d="M3 3l18 18"></path></svg><span class="anon-t">{{anonLabel}}</span></button>
<div style="position: relative">
<button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="true" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px 0 0; border: none; background: transparent; font-family: inherit; font-size: 13px; color: #444444; cursor: pointer">
<span style="width: 32px; height: 32px; border-radius: 50%; background: #F4EFF9; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #502579">JK</span><span class="me-name">Jiyoung Kwahk</span><span class="pill">Faculty</span>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#444444" stroke-width="2" style="{{menuChev}}"><path d="M4 6l4 4 4-4"></path></svg>
</button>
<template data-if="menuOpen">
<div role="menu" style="position: absolute; right: 0; top: 46px; z-index: 5; width: 300px; background: #FFFFFF; box-shadow: 0 0 0 1px #E0E0E0, 0 10px 24px rgba(0,0,0,0.08)">
<div style="padding: 12px 16px 10px; border-bottom: 1px solid #EEEEEE"><div style="font-size: 14px; font-weight: 600">Jiyoung Kwahk</div><div style="margin-top: 2px; font-size: 12px; color: #444444">Professor · Program Chair · Data Science &amp; AI</div><div class="lbl" style="margin-top: 10px">View Arete as · {{roleLabel}}</div></div>
<template data-for="roleItems" data-as="ri">
<button type="button" role="menuitemradio" aria-checked="{{ri.on}}" onClick="{{ri.pick}}" style="{{ri.style}}"><span style="display: block; font-size: 14px; font-weight: 500">{{ri.t}}</span><span style="display: block; margin-top: 2px; font-size: 12px; color: #6B6B6B">{{ri.sub}}</span></button>
</template>
<div style="padding: 10px 16px; border-top: 1px solid #EEEEEE; display: flex; gap: 16px; font-size: 13px"><a href="#">Change password</a><a href="#signout">Sign out</a></div>
</div>
</template>
</div>
</header>

<main style="padding: 32px 40px 100px; display: flex; flex-direction: column; gap: 64px">

<section aria-label="This term at a glance" style="background: #2E1648; color: #FFFFFF; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 380px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; min-height: 420px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span style="padding: 3px 9px; font-weight: 600; font-size: 12px; color: #111111; background: #FFFFFF">{{hero.chip}}</span><span style="opacity: 0.85">{{hero.when}}</span></div>
<div style="margin-top: 28px; font-size: 14px; opacity: 0.85">{{hero.sub}}</div>
<h1 style="margin: 8px 0 0; font-weight: 300; font-size: clamp(32px, 3.4vw, 50px); line-height: 1.05; letter-spacing: -0.02em">{{hero.title}}</h1>
<div style="margin-top: 16px; font-size: 15px; line-height: 1.6; opacity: 0.9">{{hero.meta}}</div>
<a href="{{hero.href}}" style="margin-top: auto; padding-top: 28px; align-self: flex-start; font-size: 15px"><span style="border-bottom: 1px solid #FFFFFF; padding-bottom: 3px">{{hero.open}}</span></a>
</div>
<div style="flex: 1.3 1 480px; padding: 40px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 14px">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 12px; opacity: 0.75"><span>{{hero.chartTitle}}</span><span>{{hero.chartRight}}</span></div>
<template data-for="hero.rows" data-as="r">
<div style="display: grid; grid-template-columns: 150px 1fr 92px; gap: 14px; align-items: center">
<span style="font-size: 13px; line-height: 1.25"><span style="font-weight: 600">{{r.code}}</span> <span style="opacity: 0.75">{{r.name}}</span></span>
<span style="position: relative; display: flex; height: 22px; background: rgba(255,255,255,0.12)">
<template data-for="r.segs" data-as="s"><span class="seg" style="{{s.style}}">{{s.t}}</span></template>
<template data-if="r.hasStd"><span aria-hidden="true" style="{{r.stdStyle}}"></span></template>
</span>
<span style="font-size: 13px; font-variant-numeric: tabular-nums; text-align: right"><span style="font-weight: 600">{{r.share}}</span> <span style="{{r.flagStyle}}">{{r.flag}}</span></span>
</div>
</template>
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 6px; font-size: 12px; opacity: 0.85">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #0077B6"></span>Exemplary</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #2EA043"></span>Proficient</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #ED7D31"></span>Developing</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; background: #C0504D"></span>Needs Improvement</span>
<template data-if="hero.showStdKey"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 0; height: 12px; border-left: 2px dashed #FFFFFF"></span>standard of performance</span></template>
</div>
</div>
</section>

<section aria-labelledby="lv-h">
<div class="sh"><h2 id="lv-h">Aggregation levels</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px">
<template data-for="levels" data-as="l">
<a href="{{l.href}}" class="tile">
<span style="font-size: 12px; font-weight: 600; color: #502579">{{l.code}}</span>
<span style="font-size: 20px; font-weight: 300; letter-spacing: -0.01em">{{l.name}}</span>
<span style="font-size: 13px; color: #6B6B6B; line-height: 1.45">{{l.what}}</span>
<span style="margin-top: auto; padding-top: 10px; font-size: 13px; line-height: 1.4">{{l.scope}}</span>
</a>
</template>
</div>
</section>

<section aria-labelledby="att-h">
<div class="sh"><h2 id="att-h">Needs attention</h2></div>
<div style="display: flex; flex-direction: column">
<template data-for="att" data-as="a">
<a href="{{a.href}}" style="display: grid; grid-template-columns: 120px 1fr auto; gap: 8px 24px; align-items: baseline; padding: 16px 0; border-bottom: 1px solid #EEEEEE">
<span class="lbl">{{a.tag}}</span>
<span style="font-size: 15px; line-height: 1.5"><span style="font-weight: 500">{{a.what}}</span> <span style="color: #6B6B6B">{{a.detail}}</span></span>
<span style="font-size: 13px; white-space: nowrap; color: #502579"><span style="border-bottom: 1px solid #502579; padding-bottom: 1px">{{a.go}}</span></span>
</a>
</template>
</div>
</section>

<section aria-labelledby="cal-h">
<div class="sh"><h2 id="cal-h">Fall 2026</h2></div>
<div style="overflow-x: auto">
<div style="position: relative; min-width: 900px; height: 150px">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 52px; height: 1px; background: #111111"></span>
<span aria-hidden="true" style="position: absolute; left: 31%; top: 30px; height: 44px; border-left: 2px solid #502579"></span>
<span style="position: absolute; left: 31%; top: 6px; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: #502579; white-space: nowrap">Today · Oct 24</span>
<template data-for="cal" data-as="c">
<span style="{{c.pos}}">
<span aria-hidden="true" style="{{c.dot}}"></span>
<span style="display: block; margin-top: 14px; font-size: 13px; font-weight: 500; white-space: nowrap">{{c.when}}</span>
<span style="display: block; margin-top: 2px; font-size: 13px; color: #6B6B6B; line-height: 1.4; max-width: 170px">{{c.what}}</span>
</span>
</template>
</div>
</div>
</section>

<template data-if="showCourses">
<section aria-labelledby="co-h">
<div class="sh"><h2 id="co-h">{{coursesTitle}}</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 24px">
<template data-for="courses" data-as="o">
<a href="{{o.href}}" style="{{o.box}}">
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px"><span style="padding: 3px 9px; font-weight: 600; color: #111111; background: #FFFFFF">{{o.badge}}</span><span style="opacity: 0.85">{{o.when}}</span></span>
<span style="display: block; margin-top: auto; font-size: 13px; opacity: 0.85">{{o.sub}}</span>
<span style="display: block; margin-top: 6px; font-weight: 300; font-size: 26px; line-height: 1.1; letter-spacing: -0.01em">{{o.title}}</span>
<span style="display: block; margin-top: 10px; font-size: 13px; opacity: 0.9">{{o.meta}}</span>
</a>
</template>
</div>
</section>
</template>

</main>
</div>
</template>
<template id="tpl-al0">
<div style="font-family: Inter, system-ui, sans-serif; color: #111111; background: #FFFFFF">

<header class="top">
<a href="#home" aria-label="Arete Pro, home" style="display: flex; align-items: center; gap: 12px">

<span style="font-family: Marcellus, Georgia, serif; font-weight: 400; font-size: 25px; letter-spacing: 0.06em; color: #111111">Arete Pro</span>
</a>
<nav class="nav" aria-label="Main">
<a href="#home">Home</a>
<a href="#al0" aria-current="page" style="border-bottom-color: #502579; color: #502579; font-weight: 500">AL0 Assessment</a>
<a href="#al1">AL1 Student</a>
<a href="#al2">AL2 Course</a>
<a href="#al3">AL3 Program</a>
<a href="#al4">AL4 Institution</a>
<a href="#">About</a>
<a href="#">Settings</a>
</nav>
<button type="button" class="anon-btn" onClick="{{toggleAnon}}" aria-pressed="{{anon}}" title="Show students as S1, S2 … (for demos and screen sharing)" style="{{anonStyle}}"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7c2.1 0 3.9.7 5.4 1.7M22 12s-3.5 7-10 7c-2.1 0-3.9-.7-5.4-1.7"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path><path d="M3 3l18 18"></path></svg><span class="anon-t">{{anonLabel}}</span></button>
<div style="position: relative">
<button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuOpen}}" aria-haspopup="true" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px 0 0; border: none; background: transparent; font-family: inherit; font-size: 13px; color: #444444; cursor: pointer">
<span style="width: 32px; height: 32px; border-radius: 50%; background: #F4EFF9; display: flex; align-items: center; justify-content: center; font-weight: 600; color: #502579">{{meInitials}}</span><span class="me-name">{{meName}}</span><span class="pill">Faculty</span>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#444444" stroke-width="2" style="{{menuChev}}"><path d="M4 6l4 4 4-4"></path></svg>
</button>
<template data-if="menuOpen">
<div role="menu" style="position: absolute; right: 0; top: 46px; z-index: 5; width: 300px; background: #FFFFFF; box-shadow: 0 0 0 1px #E0E0E0, 0 10px 24px rgba(0,0,0,0.08)">

</template>

<template data-if="ready">

<div class="lbl">AL0 Assessment · course</div>

<h1 id="co-h" style="margin: 0; font-weight: 300; font-size: clamp(30px, 3.2vw, 44px); line-height: 1.08; letter-spacing: -0.02em">{{course.title}} <span style="color: #6B6B6B">· {{course.term}}</span></h1>
<span style="font-size: 13px; color: #6B6B6B">{{course.meta}}</span>
</div>
<div aria-label="Course ratings workbook" style="margin-top: 20px; background: #FFFFFF; box-shadow: 0 0 0 1px #D4D4D4">

<svg aria-hidden="true" width="18" height="18" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="13" height="13" fill="#1D6F42"></rect><path d="M5 5l6 6M11 5l-6 6" stroke="#FFFFFF" stroke-width="1.6"></path></svg>
<span style="font-size: 13px; font-weight: 600">{{wb.title}}</span>
<span style="margin-left: auto; display: flex; gap: 8px">
<button type="button" class="xb" onClick="{{exportWb}}" title="{{exportTip}}" style="background: #FFFFFF"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2" width="12" height="12"></rect><path d="M2 6h12M2 10h12M6 2v12"></path></svg>Export</button>
<template data-if="canImport"><input type="file" id="al0-file" accept=".xlsx" onChange="{{importFile}}" style="display: none"><button type="button" class="xb" onClick="{{pickFile}}" style="background: #FFFFFF"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2v8M5 7l3 3 3-3M2 12v2h12v-2"></path></svg>Import</button></template>
</span>
</div>
<div style="overflow-x: auto">
<div style="{{wb.grid}}">
<template data-for="wb.cells" data-as="x"><span title="{{x.tip}}" style="{{x.s}}">{{x.t}}</span></template>
</div>
</div>
<div role="tablist" aria-label="Workbook tabs" style="display: flex; overflow-x: auto; background: #F5F5F3; border-top: 1px solid #D4D4D4; padding: 0 6px">
<template data-for="wb.tabs" data-as="t"><button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.s}}">{{t.t}}</button></template>
</div>
</div>
<template data-if="rc">
<div role="region" aria-label="Latest upload" style="margin-top: 12px; padding: 12px 16px; background: #FFFBEB; box-shadow: inset 0 0 0 1px #F2B705">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px">
<span style="width: 12px; height: 12px; box-shadow: inset 0 0 0 2px #F2B705; background: #FFFFFF; flex: none"></span>
<span style="font-size: 14px; font-weight: 600">{{rc.title}}</span><span style="font-size: 13px; color: #6B5300">{{rc.sub}}</span>
<span style="margin-left: auto; display: flex; gap: 8px"><button type="button" class="xb" onClick="{{rc.toggle}}" aria-expanded="{{rc.open}}" style="background: #FFFFFF">{{rc.toggleLabel}}</button><button type="button" class="xb" onClick="{{rc.undoAll}}" style="background: #FFFFFF">Undo this upload</button></span>
</div>
<template data-if="rc.msg"><p style="margin: 8px 0 0; font-size: 13px; color: #8A3A0A">{{rc.msg}}</p></template>
<template data-if="rc.open">
<div style="margin-top: 10px; overflow-x: auto">
<div style="display: grid; grid-template-columns: minmax(180px, 1.3fr) minmax(150px, 1fr) 60px 110px auto; min-width: 620px; font-size: 13px; align-items: center">
<template data-for="rc.rows" data-as="x">
<span style="padding: 6px 12px 6px 0; border-bottom: 1px solid #F3E3A8">{{x.cp}}</span><span style="padding: 6px 12px 6px 0; border-bottom: 1px solid #F3E3A8">{{x.who}}</span><span style="padding: 6px 0; border-bottom: 1px solid #F3E3A8; font-weight: 600">{{x.code}}</span><span style="padding: 6px 0; border-bottom: 1px solid #F3E3A8; font-variant-numeric: tabular-nums">{{x.change}}</span><span style="padding: 4px 0; border-bottom: 1px solid #F3E3A8; text-align: right"><button type="button" class="xb" onClick="{{x.undo}}" style="min-height: 30px; background: #FFFFFF">Undo</button></span>
</template>
</div>
</div>
<template data-if="rc.more"><button type="button" class="xb" onClick="{{rc.showAll}}" style="margin-top: 8px; background: #FFFFFF">{{rc.more}}</button></template>
</template>
</div>
</template>
<template data-if="imp">
<div role="region" aria-label="Import preview" style="margin-top: 16px; padding: 16px 18px; box-shadow: inset 0 0 0 1px #2E1648; background: #FFFFFF">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px"><span style="font-size: 15px; font-weight: 600">{{imp.title}}</span><span class="lbl">{{imp.file}}</span></div>
<template data-if="imp.msg"><p style="{{imp.msgStyle}}">{{imp.msg}}</p></template>
<template data-if="imp.hasGroups">
<div style="margin-top: 12px; overflow-x: auto">
<div style="display: grid; grid-template-columns: minmax(180px, 1.2fr) minmax(200px, 1.4fr) minmax(200px, 1.4fr) minmax(180px, 1fr); min-width: 760px; font-size: 13px">
<span class="lbl" style="padding: 6px 0; border-bottom: 1px solid #111111">Method</span><span class="lbl" style="padding: 6px 0; border-bottom: 1px solid #111111">Checkpoint</span><span class="lbl" style="padding: 6px 0; border-bottom: 1px solid #111111">In Arete</span><span class="lbl" style="padding: 6px 0; border-bottom: 1px solid #111111">Ratings in the file</span>
<template data-for="imp.groups" data-as="g">
<span style="{{g.cs}}">{{g.method}}</span><span style="{{g.cs}}; font-weight: 600">{{g.label}}</span><span style="{{g.cs}}">{{g.status}}</span><span style="{{g.cs}}">{{g.counts}}</span>
</template>
</div>
</div>
</template>
<template data-if="imp.hasProblems">
<div style="margin-top: 12px; font-size: 13px; color: #8A3A0A">Not imported:</div>
<ul style="margin: 4px 0 0; padding-left: 18px; font-size: 13px; line-height: 1.6; color: #8A3A0A"><template data-for="imp.problems" data-as="x"><li>{{x}}</li></template></ul>
</template>
<div style="margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px">
<template data-if="imp.canUpload"><button type="button" class="xb" onClick="{{imp.upload}}" style="background: #2E1648; color: #FFFFFF; box-shadow: none">{{imp.uploadLabel}}</button></template>
<button type="button" class="xb" onClick="{{imp.close}}">{{imp.closeLabel}}</button>
</div>
</div>
</template>
</section>

<div class="lay2" style="display: flex; flex-wrap: wrap; align-items: stretch; flex: 1 1 auto">
<aside aria-label="Students" class="stu-col" style="flex: 1 1 240px; max-width: 280px; box-sizing: border-box; border-right: 1px solid #E6E6E6">
<div class="stu-in" style="padding: 24px 0 40px">
<div class="stu-h" style="padding: 0 24px 10px; font-size: 15px; font-weight: 500">Students <span style="font-weight: 400; font-size: 13px; color: #6B6B6B">{{studentCount}}</span></div>
<template data-for="students" data-as="s">
<button type="button" class="stu" onClick="{{s.pick}}" aria-current="{{s.cur}}" style="{{s.s}}"><span class="stu-nm" style="font-size: 14px; font-weight: 500">{{s.name}}</span><span class="stu-no" style="font-size: 12px; color: #6B6B6B">{{s.no}}</span><span class="stu-sh" style="display: none; font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{s.short}}</span></button>
</template>

<div class="lay2-main" style="flex: 999 1 640px; min-width: 0; padding: 32px 40px 100px">
<div class="dd-bar dd-in"><label class="dd-l" for="dd-stu">Student</label><select id="dd-stu" class="dd" onChange="{{pickStuDd}}"><template data-for="students" data-as="s"><option value="{{s.key}}" selected="{{s.cur}}">{{s.name}} {{s.no}}</option></template></select></div>
<section aria-labelledby="st-h" style="display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<h2 id="st-h" style="margin: 0; font-weight: 300; font-size: 34px; letter-spacing: -0.01em">{{stu.name}} <span style="font-size: 16px; color: #6B6B6B">{{stu.no}}</span></h2>
</div>

<button type="button" class="tg" onClick="{{showClo}}" aria-pressed="{{isClo}}" style="{{tgClo}}">CLO</button>
<button type="button" class="tg" onClick="{{showPlo}}" aria-pressed="{{isPlo}}" style="{{tgPlo}}">PLO</button>
</div>
</div>

<div>
<div class="sh" style="margin-bottom: 0"><h2>Assessment methods with a rubric</h2></div>
<div style="overflow-x: auto">
<div style="{{gridStyle}}">

<template data-for="rows" data-as="r">
<template data-if="r.isMethod">
<div style="{{r.bandStyle}}">
<input type="checkbox" id="{{r.cid}}" checked="{{r.on}}" onChange="{{r.toggle}}" aria-label="{{r.incLabel}}" style="width: 20px; height: 20px; margin: 0; accent-color: #FFFFFF; flex: none">
<label for="{{r.cid}}" style="cursor: pointer; flex: 1 1 320px"><span style="display: block; font-size: 15px; font-weight: 600">{{r.title}}</span><span style="display: block; margin-top: 2px; font-size: 13px; opacity: 0.85">{{r.meta}}</span></label>
<button type="button" onClick="{{r.toggleDefs}}" aria-expanded="{{r.defsOpen}}" style="{{r.defsBtn}}">{{r.defsLabel}}</button>
</div>
</template>
<template data-if="r.isDefs">
<div style="grid-column: 1 / -1; margin: 4px 0 6px; box-shadow: inset 0 0 0 1px #2E1648">
<div style="{{defsGrid}}">
<span style="padding: 8px 12px; font-size: 12px; color: #6B6B6B; border-bottom: 1px solid #E6DEF0">Code</span><span style="{{defsTitleHead}}">Title</span><span style="padding: 8px 12px; font-size: 12px; color: #6B6B6B; border-bottom: 1px solid #E6DEF0">Definition</span>
<template data-for="defs" data-as="d">
<span style="padding: 9px 12px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #F0ECF5">{{d.code}}</span><span style="{{d.titleStyle}}">{{d.title}}</span><span style="padding: 9px 12px; font-size: 13px; line-height: 1.5; color: #444444; border-bottom: 1px solid #F0ECF5">{{d.def}}</span>
</template>
</div>
</div>
</template>
<template data-if="r.isHead">
<span class="lbl" style="padding: 10px 0; border-bottom: 1px solid #111111">Criterion</span>
<span class="lbl" style="padding: 10px 0; border-bottom: 1px solid #111111">Rating</span>
<span class="lbl" style="padding: 10px 12px 10px 0; border-bottom: 1px solid #111111; text-align: right">Weight</span>
<template data-for="cols" data-as="c"><span title="{{c.tip}}" style="padding: 10px 0; border-bottom: 1px solid #111111; font-size: 13px; font-weight: 600; text-align: center">{{c.code}}<span style="display: block; font-size: 11px; font-weight: 400; color: #6B6B6B">{{c.tag}}</span></span></template>
</template>
<template data-if="r.isNote">
<div style="grid-column: 1 / -1; padding: 10px 14px; font-size: 13px; color: #6B6B6B; border-bottom: 1px solid #EEEEEE">{{r.text}}</div>
</template>
<template data-if="r.isCp">
<div style="{{r.rowStyle}}">
<template data-if="r.canFold"><button type="button" onClick="{{r.fold}}" aria-expanded="{{r.open}}" aria-label="{{r.foldLabel}}" style="width: 28px; height: 28px; margin: -4px 0 -4px -6px; padding: 0; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; align-self: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#111111" stroke-width="1.8" style="{{r.chev}}"><path d="M6 3l5 5-5 5"></path></svg></button></template>
<span style="font-size: 12px; color: #6B6B6B">Checkpoint</span>
<span style="font-weight: 600">{{r.title}}</span>
<span style="color: #6B6B6B">{{r.meta}}</span>
<span style="{{r.stateStyle}}">{{r.state}}</span>
</div>
</template>
<template data-if="r.isCrit">
<span style="{{r.nameStyle}}">{{r.name}}</span>
<span style="padding: 9px 0; border-bottom: 1px solid #EEEEEE"><span class="chip" style="{{r.chip}}">{{r.lv}}</span></span>
<span style="padding: 9px 12px 9px 0; border-bottom: 1px solid #EEEEEE; font-size: 13px; color: #444444; text-align: right; font-variant-numeric: tabular-nums">{{r.w}}</span>

</template>
</template>

<div style="grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 32px; padding: 12px 14px; background: #2E1648; color: #FFFFFF">
<span style="font-size: 12px; opacity: 0.8">Result</span>
<span style="font-size: 16px; font-weight: 600">{{resTitle}}</span>
<span role="group" aria-label="Reading" style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px">
<template data-for="readings" data-as="g"><button type="button" onClick="{{g.pick}}" aria-pressed="{{g.on}}" style="{{g.s}}">{{g.t}}</button></template>
</span>
</div>
<div style="grid-column: 1 / -1; background: #F3EFF7; padding: 0 14px">
<div style="display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 12px 0 4px; font-size: 12px; color: #444444"><span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; background: #0077B6"></span>Exemplary</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; background: #2EA043"></span>Proficient</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; background: #ED7D31"></span>Developing</span><span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; background: #C0504D"></span>Needs Improvement</span><span>{{readNote}}</span></div>
</div>
<span style="padding: 10px 0 10px 14px; background: #F3EFF7"></span><span style="padding: 10px 0; background: #F3EFF7"></span><span style="padding: 10px 0; background: #F3EFF7"></span>
<template data-for="cols" data-as="c"><span title="{{c.tip}}" style="padding: 10px 0; background: #F3EFF7; font-size: 13px; font-weight: 600; text-align: center; color: #2E1648">{{c.code}}</span></template>

<span style="padding: 14px 0 14px 14px; background: #F3EFF7; font-size: 14px; font-weight: 600">Weighted median</span>
<span style="padding: 14px 0; background: #F3EFF7; font-size: 12px; color: #444444; grid-column: span 2">50% of the weight</span>
<template data-for="res" data-as="m">
<span style="padding: 14px 8px; background: #F3EFF7">
<span style="position: relative; display: flex; height: 16px; background: #FFFFFF">
<template data-for="m.segs" data-as="g"><span class="seg" style="{{g.style}}"></span></template>
<span aria-hidden="true" style="position: absolute; left: 50%; top: -5px; bottom: -5px; border-left: 2px solid #111111"></span>
</span>
</span>
</template>

<span style="padding: 14px 0 16px 14px; background: #F3EFF7; font-size: 15px; font-weight: 600; border-top: 1px solid #DCD3E8">{{readLabel}}</span>
<span style="padding: 14px 0 16px; background: #F3EFF7; font-size: 12px; color: #444444; border-top: 1px solid #DCD3E8; grid-column: span 2">{{readSub}}</span>
<template data-for="res" data-as="m">
<span style="padding: 14px 0 16px; background: #F3EFF7; text-align: center; border-top: 1px solid #DCD3E8"><span style="{{m.big}}">{{m.lv}}</span><span style="display: block; margin-top: 6px; font-size: 13px; font-weight: 600; color: #2E1648; font-variant-numeric: tabular-nums">{{m.pp}}</span></span>
</template>

<span style="padding: 14px 0 16px 14px; background: #F3EFF7; font-size: 15px; font-weight: 600; border-top: 1px solid #DCD3E8">Record</span>
<span style="padding: 14px 0 16px; background: #F3EFF7; font-size: 12px; color: #444444; border-top: 1px solid #DCD3E8; grid-column: span 2">summative checkpoints only</span>
<template data-for="rec" data-as="m">
<span style="padding: 14px 0 16px; background: #F3EFF7; text-align: center; border-top: 1px solid #DCD3E8"><span style="{{m.big}}">{{m.lv}}</span></span>
</template>
</div>
</div>
</div>
</section>
</div>
</div>
</template>
</div>
</template>

<template data-if="isInst">
<div style="flex: 1 1 100%; padding: 64px 40px 120px">
<div style="max-width: 640px; padding: 28px; box-shadow: inset 0 0 0 1px #E0E0E0">
<div class="lbl">AL0 Assessment</div>
<div style="margin-top: 8px; font-size: 22px; font-weight: 300">Opened on request</div>

          chev: 'display: block; transition: transform 150ms ease; transform: rotate(' + (open ? 90 : 0) + 'deg)',
          rowStyle: 'grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 10px 14px; background: #F7F7F5; border-bottom: 1px solid #EEEEEE; font-size: 13px' + (has ? '' : '; opacity: 0.45'),
          stateStyle: 'margin-left: auto; padding: 2px 8px; font-size: 12px; font-weight: 600; ' + (has ? 'color: #FFFFFF; background: #111111' : 'color: #6B6B6B; box-shadow: inset 0 0 0 1px #CFCFCF') });
        if (!open) return;
        S.inUse[k.checkpoint_id].forEach((c) => {
          // stage-specific sub-criteria first (detail), then the criterion that counts
          S.subs[k.checkpoint_id].filter((i) => i.parent_criterion_id === c.criterion_id).forEach((i) => {
            const r = rs.find((x) => x.item_id === i.item_id), lv = r ? r.level : '';
            const hot = S.recentKey[k.checkpoint_id + '|i' + i.item_id + '|' + stuNo];
            rows.push({ isCrit: true, name: i.code + ' ' + i.name, lv: lv || (hot ? '—' : '·'), chip: (lv ? chip(lv) + '; opacity: 0.7' : 'color: #C8C8C8') + (hot ? '; outline: 2px solid #F2B705; outline-offset: 2px' : ''), w: '—',
              nameStyle: 'padding: 9px 0 9px 44px; border-bottom: 1px solid #EEEEEE; font-size: 13px; font-style: italic; color: #6B6B6B',
              cells: cols.map(() => ({ t: '', style: '' })) });
          });
          const r = rs.find((x) => x.criterion_id === c.criterion_id), lv = r ? r.level : '';
          const hot = S.recentKey[k.checkpoint_id + '|c' + c.criterion_id + '|' + stuNo];
          rows.push({ isCrit: true, name: c.code + ' ' + c.name, lv: lv || (hot ? '—' : '·'), chip: (lv ? chip(lv) : 'color: #C8C8C8') + (hot ? '; outline: 2px solid #F2B705; outline-offset: 2px' : ''), w: (Math.round(c.w * 10) / 10).toString(),
            nameStyle: 'padding: 9px 0 9px 28px; border-bottom: 1px solid #EEEEEE; font-size: 14px',
            cells: cols.map((col) => links(c.criterion_id).includes(col.id) && lv ? { t: lv, style: chip(lv) } : { t: '·', style: 'color: #C8C8C8' }) });
        });
      });
    });

    // readings: progress (latest rating per criterion, 'progress' checkpoints), each checkpoint on its own, and the record
    const cpOrder = (a, b) => (a.held_from || '').localeCompare(b.held_from || '') || a.sort_order - b.sort_order;
    const pooled = S.cps.filter((k) => inc(k.rubric_id)).sort(cpOrder);
    const latest = (list) => {
      const pick = {};
      list.forEach((k) => ratingsAt(k).forEach((x) => { if (x.criterion_id) pick[x.criterion_id] = x.level; }));
      return pick;
    };
    const ratedCps = pooled.filter((k) => ratingsAt(k).some((x) => x.criterion_id));
    const progress = latest(pooled.filter((k) => k.reading === 'progress'));
    const record = latest(pooled.filter((k) => k.kind === 'summative'));
    let reading = this.state.reading;
    if (reading == null || (reading !== 'progress' && !ratedCps.some((k) => k.checkpoint_id === reading)))
      reading = Object.keys(progress).length || !ratedCps.length ? 'progress' : ratedCps[ratedCps.length - 1].checkpoint_id;
    const pool = reading === 'progress' ? progress : latest(ratedCps.filter((k) => k.checkpoint_id === reading));
    const big = (l) => 'display: inline-flex; align-items: center; justify-content: center; min-width: 48px; height: 32px; padding: 0 8px; box-sizing: border-box; font-size: 15px; font-weight: 700; color: #FFFFFF; background: ' + COL[l];
    const none = 'display: inline-flex; align-items: center; justify-content: center; min-width: 48px; height: 32px; box-sizing: border-box; font-size: 15px; color: #8A8A8A; background: #FFFFFF; box-shadow: inset 0 0 0 1px #CFCFCF';
    const outcome = (pick, col) => this.wmed(Object.keys(pick).filter((cid) => links(Number(cid)).includes(col.id))
      .map((cid) => ({ lv: pick[cid], w: S.critById[cid] ? S.critById[cid].w : 0 })));
    const res = cols.map((col) => {
      const r = outcome(pool, col);
      if (!r) return { lv: '—', big: none, pp: 'no evidence', segs: [] };
      return { lv: r.tie ? r.lv + '/' + r.tie + ' tie → ' + r.lv : r.lv, big: big(r.lv), pp: r.pp + '% P+',
        segs: r.segs.map((g) => ({ style: 'width: ' + (g.w * 100) + '%; background: ' + COL[g.l] })) };
    });
    const rec = cols.map((col) => { const r = outcome(record, col); return r ? { lv: r.lv, big: big(r.lv) } : { lv: '', big: 'display: inline-block; width: 48px; height: 32px; box-sizing: border-box; border: 1.5px dashed #9C8FB0; background: #FFFFFF' }; });
    const rBtn = (on) => 'min-height: 32px; padding: 0 12px; border: none; font-family: inherit; font-size: 12px; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #2E1648; font-weight: 600' : 'background: transparent; color: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6)');
    const readings = [{ t: 'Progress', id: 'progress' }].concat(ratedCps.map((k) => ({ t: k.label, id: k.checkpoint_id })))
      .map((g) => ({ t: g.t, on: reading === g.id, s: rBtn(reading === g.id), pick: () => this.setState({ reading: g.id }) }));
    const curCp = reading === 'progress' ? null : ratedCps.find((k) => k.checkpoint_id === reading);

    // workbook peek
    const wb = this.workbook(S, chip, cpWhen);
    // definitions
    const defs = isClo ? S.clos.map((c, i) => ({ code: 'CLO' + (i + 1), title: '', def: c.text || '' }))
      : S.plos.map((p) => ({ code: p.plo_code, title: p.title, def: p.definition || '' }));
    const hasTitle = !isClo;
    const tgOn = 'background: #111111; color: #FFFFFF; box-shadow: inset 0 0 0 1px #111111';
    const nStu = S.students.length;
    return {
      ready: true,
      course: { title: S.o.course_id + ' ' + (S.o.title || (S.o.courses && S.o.courses.title) || ''), term: S.term,
        meta: nStu + ' students' + (S.lastDate ? ' · ratings uploaded up to ' + fmtDate(S.lastDate) : ' · no ratings yet') },
      wb: wb, studentCount: nStu ? '· ' + nStu : '',
      imp: this.importVals(S), pickFile: () => this.pickFile(),
      pickStuDd: (e) => { const s = S.students.find((x) => String(x.no) === e.target.value); if (s) { ARETE.course.sel.stu = s.no; this.setState({ stu: s.no }); } }, importFile: (e) => this.importFile(e), rc: this.recentVals(S),
      exportWb: () => this.exportWorkbook(S), exportTip: Object.keys(S.R).length ? 'Download the course workbook with the ratings stored so far' : 'Download an empty template for this course',
      rosterNote: S.rosterOk ? '' : 'The class list could not be read, so students are shown by number.',
      students: S.students.map((s) => ({ name: ARETE.who(s.no, s.name), no: ARETE.sno(s.no), cur: s.no === stuNo ? 'true' : false,
        key: String(s.no), short: String(ARETE.who(s.no, s.name) || '').split(' ')[0],
        s: s.no === stuNo ? 'background: #F4EFF9; box-shadow: inset 3px 0 0 #502579' : '', pick: () => { ARETE.course.sel.stu = s.no; this.setState({ stu: s.no }); } })),
      stu: { name: ARETE.who(stu.no, stu.name), no: ARETE.sno(stu.no) }, isClo: isClo, isPlo: !isClo, tgClo: isClo ? tgOn : '', tgPlo: isClo ? '' : tgOn,
      showClo: () => this.setState({ set: 'CLO' }), showPlo: () => this.setState({ set: 'PLO' }),
      cols: cols, rows: rows, res: res, rec: rec, readings: readings,
      resTitle: isClo ? 'CLO results' : 'PLO results',
      readLabel: reading === 'progress' ? 'Progress' : curCp.label,
      readSub: reading === 'progress' ? 'latest rating of each criterion, checkpoints counted in progress' : 'this checkpoint on its own',
      readNote: 'black line = 50% of the weight · % = share of weight at Proficient or above · N/O left out',
      defs: defs.map((d) => Object.assign({ titleStyle: hasTitle ? 'padding: 9px 12px; font-size: 13px; font-weight: 500; border-bottom: 1px solid #F0ECF5' : 'display: none' }, d)),
      defsGrid: 'display: grid; grid-template-columns: 80px ' + (hasTitle ? '220px ' : '') + '1fr',
      defsTitleHead: hasTitle ? 'padding: 8px 12px; font-size: 12px; color: #6B6B6B; border-bottom: 1px solid #E6DEF0' : 'display: none',
      gridStyle: 'display: grid; grid-template-columns: minmax(260px, 1.6fr) 72px 72px repeat(' + Math.max(cols.length, 1) + ', minmax(64px, 1fr)); align-items: center; min-width: ' + (420 + cols.length * 70) + 'px'
    };
  }

  // ---------- export: the course workbook, ready to fill (and the layout Import reads) ----------
  // README, Students, and one tab per assessment method with a rubric. In a method tab each
  // checkpoint is a column group with the criteria it uses (sub-criteria first, then the
  // criterion); under each code sit the criterion's name and its level definitions.
  // Row 4 is hidden and carries the ids Import matches on. Stored ratings are filled in;
  // with none yet the file is the course's template.
  exportWorkbook(S) {
    ARETE.db.exceljs().then((EX) => {
      const K = ARETE.course, wb = new EX.Workbook();
      wb.creator = 'Arete Pro'; wb.created = new Date();
      const F = 'Arial', LEVEL = { E: '0077B6', P: '2EA043', D: 'ED7D31', NI: 'C0504D', 'N/O': 'D9D9D9' };
      const LNAME = { E: 'Exemplary', P: 'Proficient', D: 'Developing', NI: 'Needs Improvement' };
      const fill = (hex) => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF' + hex } });
      const font = (o) => Object.assign({ name: F, size: 10 }, o || {});
      const thin = { style: 'thin', color: { argb: 'FFD4D4D4' } }, edge = { style: 'medium', color: { argb: 'FF7F7F7F' } };
      const fmt = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
      const when = (k) => k.held_from ? fmt(k.held_from) + (k.held_to && k.held_to !== k.held_from ? ' – ' + fmt(k.held_to) : '') : 'through the term';
      const defs = (d) => ['E', 'P', 'D', 'NI'].filter((l) => d && d[l]).map((l) => l + '  ' + d[l]).join('\n');
      const title = S.o.course_id + ' ' + (S.o.title || (S.o.courses && S.o.courses.title) || '');
      const any = Object.keys(S.R).length > 0;

      // README
      const rd = wb.addWorksheet('README', { properties: { tabColor: { argb: 'FF502579' } } });
      rd.getColumn(1).width = 14; rd.getColumn(2).width = 100;
      // a heading (nothing in column B) spans both columns so it is never cut off
      const line = (a, b, f) => {
        const r = b ? rd.addRow([a, b]) : rd.addRow([a]);
        r.font = f || font();
        if (b) r.getCell(2).alignment = { wrapText: true, vertical: 'top' }; else if (a) rd.mergeCells(r.number, 1, r.number, 2);
        return r;
      };
      line(title + ' · ' + S.term, '', font({ bold: true, size: 13 }));
      line(any ? 'Ratings workbook · exported from Arete with the ratings stored so far' : 'Ratings workbook · template (no ratings stored yet)', '', font({ color: { argb: 'FF6B6B6B' } }));
      line('', '');
      line('How to fill it', '', font({ bold: true }));
      [['Tabs', 'Students lists the class. Each assessment method with a rubric has its own tab.'],
       ['Columns', 'Each checkpoint is a group of columns with the criteria it uses. Under each code: the criterion and what each level means.'],
       ['Cells', 'Choose E, P, D, NI or N/O from the list. Leave a cell empty when it is not rated.'],
       ['Team work', 'For team criteria give every member of the team the same level.'],
       ['Sub-criteria', 'Grey italic columns are detail only; the criterion after them is the rating that counts.'],
       ['Upload', 'In Arete, AL0 → Import. Only final ratings: uploading a checkpoint again replaces its ratings; an empty checkpoint is skipped.'],
       ['Do not edit', 'Row 4 is hidden and tells Arete which checkpoint and criterion each column is. Columns may be renamed or moved.']]
        .forEach((x) => { const r = line(x[0], x[1]); r.getCell(1).font = font({ bold: true }); });
      line('', '');
      line('Checkpoints', '', font({ bold: true }));
      S.methods.forEach((m) => {
        const cps = m.cps.slice().sort(K.cpOrder);
        line(m.item, '', font({ bold: true, color: { argb: 'FF502579' } }));
        if (!cps.length) line('', 'no checkpoints set up yet');
        cps.forEach((k) => line('', k.label + ' · ' + when(k) + ' · ' + k.kind + (k.reading === 'own' ? ' · own reading only' : '') + ' · ' +
          S.inUse[k.checkpoint_id].map((c) => c.code).join(', ')));
      });
      line('', '');
      line('Levels', '', font({ bold: true }));
      ['E', 'P', 'D', 'NI', 'N/O'].forEach((l) => {
        const r = line(l, l === 'N/O' ? 'Not observable at this checkpoint (left out of the results)' : LNAME[l] + (l === 'P' ? ' · the expected level; Proficient or above = the outcome is met' : ''));
        r.getCell(1).fill = fill(LEVEL[l]); r.getCell(1).font = font({ bold: true, color: { argb: l === 'N/O' ? 'FF444444' : 'FFFFFFFF' } }); r.getCell(1).alignment = { horizontal: 'center' };
      });

      // Students
      const st = wb.addWorksheet('Students');
      st.columns = [{ header: 'Student no.', width: 14 }, { header: 'Name', width: 28 }];
      st.getRow(1).font = font({ bold: true }); st.getRow(1).fill = fill('EDEDED');
      S.students.forEach((x) => st.addRow([x.no, ARETE.who(x.no, x.name)]).font = font());
      st.views = [{ state: 'frozen', ySplit: 1 }];

      // one tab per method
      const used = new Set(['README', 'Students']);
      S.methods.forEach((m) => {
        // sheet names: at most 31 characters, cut at a word, no / ? * [ ] :
        let name = m.name.replace(/\s*\/\s*/g, ' - ').replace(/[\\?*\[\]:]/g, ' ').replace(/\s+/g, ' ').trim();
        // too long: keep the more specific part ("Reflection Essay / Learning Journaling" → "Learning Journaling",
        // "Concept Checks and Problem-solving Challenges" → "Concept Checks"), else cut at a word
        if (name.length > 31 && name.includes(' - ')) name = name.split(' - ').pop();
        if (name.length > 31 && name.includes(' and ')) name = name.split(' and ')[0];
        if (name.length > 31) name = name.slice(0, 30).replace(/\s+\S*$/, '') + '…';
        while (used.has(name)) name = name.slice(0, 27) + ' ' + used.size;
        used.add(name);
        const ws = wb.addWorksheet(name);
        const cps = m.cps.slice().sort(K.cpOrder);
        const cols = [];
        cps.forEach((k) => S.inUse[k.checkpoint_id].forEach((c) => {
          S.subs[k.checkpoint_id].filter((i) => i.parent_criterion_id === c.criterion_id).forEach((i) => cols.push({ k: k, sub: i, code: i.code, name: i.name, d: i.descriptors, parent: c.code }));
          cols.push({ k: k, crit: c, code: c.code, name: c.name, d: c.descriptors, w: c.w });
        }));
        const shown = cols.length ? cols : m.crits.map((c) => ({ code: c.code, name: c.name, d: c.descriptors, w: c.w }));
        ws.getColumn(1).width = 13; ws.getColumn(2).width = 24; ws.getColumn(3).width = 7;
        shown.forEach((c, j) => { ws.getColumn(4 + j).width = 24; });
        ws.getCell(1, 1).value = m.item; ws.getCell(1, 1).font = font({ bold: true, size: 12 });
        ws.getCell(2, 1).value = [m.scope, m.share ? m.share + '% of grade' : '', m.crits.length + ' criteria'].filter(Boolean).join(' · ');
        ws.getCell(2, 1).font = font({ color: { argb: 'FF6B6B6B' } });
        // row 3: checkpoint groups
        if (!cps.length) { ws.getCell(3, 4).value = 'No checkpoints set up yet for this method. Its criteria:'; ws.getCell(3, 4).font = font({ italic: true, color: { argb: 'FF6B6B6B' } }); }
        let c0 = 4;
        cps.forEach((k) => {
          const n = cols.filter((c) => c.k === k).length; if (!n) return;
          const has = Object.keys(S.R).some((key) => key.startsWith(k.checkpoint_id + '|'));
          if (n > 1) ws.mergeCells(3, c0, 3, c0 + n - 1);
          const cell = ws.getCell(3, c0);
          cell.value = k.label + ' · ' + when(k) + ' · ' + k.kind + (k.reading === 'own' ? ' · own reading only' : '');
          cell.fill = fill(has ? '2E1648' : 'E9E3F0'); cell.font = font({ bold: true, color: { argb: has ? 'FFFFFFFF' : 'FF2E1648' } });
          cell.alignment = { vertical: 'middle', indent: 1 };
          c0 += n;
        });
        // row 4: ids (hidden); rows 5–7: code, criterion, level definitions
        ['Student no.', 'Name', 'Team'].forEach((t, j) => { const c = ws.getCell(5, 1 + j); c.value = t; c.font = font({ bold: true }); c.fill = fill('EDEDED'); });
        ws.getCell(6, 2).value = 'Criterion'; ws.getCell(7, 2).value = 'Levels';
        [6, 7].forEach((r) => { ws.getCell(r, 2).font = font({ italic: true, color: { argb: 'FF6B6B6B' } }); });
        shown.forEach((c, j) => {
          const col = 4 + j, first = j === 0 || (cols.length && cols[j - 1].k !== c.k);
          if (cols.length) ws.getCell(4, col).value = 'checkpoint=' + c.k.label + '; ' + (c.sub ? 'sub-criterion=' : 'criterion=') + c.code;
          const h = ws.getCell(5, col); h.value = c.code; h.alignment = { horizontal: 'center' };
          h.font = c.sub ? font({ italic: true, color: { argb: 'FF8A8A8A' } }) : font({ bold: true }); h.fill = fill(c.sub ? 'F7F7F5' : 'EDEDED');
          const nm = ws.getCell(6, col); nm.value = c.name + (c.sub ? ' (detail of ' + c.parent + ')' : (c.w ? ' · weight ' + (Math.round(c.w * 10) / 10) : ''));
          nm.font = font({ size: 9, bold: !c.sub, italic: !!c.sub }); nm.alignment = { wrapText: true, vertical: 'top' };
          const df = ws.getCell(7, col); df.value = defs(c.d) || ''; df.font = font({ size: 8, color: { argb: 'FF444444' } }); df.alignment = { wrapText: true, vertical: 'top' };
          [5, 6, 7].forEach((r) => { ws.getCell(r, col).border = { left: first ? edge : thin, right: thin, bottom: thin }; });
        });
        ws.getRow(4).hidden = !!cols.length;
        ws.getRow(6).height = 30; ws.getRow(7).height = shown.some((c) => defs(c.d)) ? 150 : 18;
        // student rows from row 8
        S.students.forEach((x, i) => {
          const r = 8 + i;
          ws.getCell(r, 1).value = x.no; ws.getCell(r, 1).font = font({ color: { argb: 'FF6B6B6B' } });
          ws.getCell(r, 2).value = ARETE.who(x.no, x.name); ws.getCell(r, 2).font = font();
          cols.forEach((c, j) => {
            const col = 4 + j, cell = ws.getCell(r, col), first = j === 0 || cols[j - 1].k !== c.k;
            const rs = S.R[c.k.checkpoint_id + '|' + x.no] || [];
            const hit = rs.find((y) => c.sub ? y.item_id === c.sub.item_id : y.criterion_id === c.crit.criterion_id);
            if (hit) { cell.value = hit.level; cell.fill = fill(LEVEL[hit.level] || 'FFFFFF'); }
            cell.font = font({ bold: true, color: { argb: hit && hit.level !== 'N/O' ? 'FFFFFFFF' : 'FF111111' } });
            cell.alignment = { horizontal: 'center' };
            cell.border = { left: first ? edge : thin, right: thin, bottom: thin };
            cell.dataValidation = { type: 'list', allowBlank: true, formulae: ['"E,P,D,NI,N/O"'], showErrorMessage: true, errorTitle: 'Level', error: 'Use E, P, D, NI or N/O, or leave the cell empty.' };
          });
        });
        if (cols.length && S.students.length) {
          const ref = 'D8:' + ws.getColumn(3 + cols.length).letter + (7 + S.students.length);
          ws.addConditionalFormatting({ ref: ref, rules: Object.keys(LEVEL).map((l, i) => ({ type: 'cellIs', operator: 'equal', formulae: ['"' + l + '"'], priority: i + 1,
            style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FF' + LEVEL[l] } }, font: { bold: true, color: { argb: l === 'N/O' ? 'FF444444' : 'FFFFFFFF' } } } })) });
        }
        ws.views = [{ state: 'frozen', xSplit: 3, ySplit: 7 }];
      });

      return wb.xlsx.writeBuffer().then((buf) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        a.download = S.o.course_id + '_' + S.term.replace(' ', '') + '_ratings' + (any ? '' : '_template') + '.xlsx';
        document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      });
    }).catch((e) => this.setState({ imp: { stage: 'error', file: '', msg: 'Could not export: ' + e.message } }));
  }

  // ---------- import: read the course workbook, preview, then upload ----------
  pickFile() { const el = document.getElementById('al0-file'); if (el) { el.value = ''; el.click(); } }

  importFile(e) {
    const file = e && e.target && e.target.files && e.target.files[0], S = this.data[this.state.off];
    if (!file || !S) return;
    this.setState({ imp: { stage: 'reading', file: file.name } });
    Promise.all([ARETE.db.xlsx(), file.arrayBuffer()])
      .then(([X, buf]) => this.setState({ imp: Object.assign(this.readWorkbook(S, X.read(buf, { type: 'array' })), { stage: 'preview', file: file.name }) }))
      .catch((ex) => this.setState({ imp: { stage: 'error', file: file.name, msg: 'Could not read the file: ' + ex.message } }));
  }

  // one plan entry per checkpoint group that holds any rating
  readWorkbook(S, wb) {
    const X = window.XLSX, LV = { E: 'E', P: 'P', D: 'D', NI: 'NI', 'N/O': 'N/O', NO: 'N/O' };
    const norm = (t) => String(t || '').replace(/^CP\d+\s+/i, '').trim().toLowerCase();
    const known = new Set(S.students.map((x) => x.no)), groups = [], problems = [];
    wb.SheetNames.forEach((sheet) => {
      const rows = X.utils.sheet_to_json(wb.Sheets[sheet], { header: 1, raw: false, defval: '' });
      const idRow = rows.findIndex((r) => r.some((c) => /^checkpoint=/.test(String(c))));
      if (idRow < 0) return;   // README, Students, or a method with no checkpoints
      const title = String((rows[0] || [])[0] || '').trim();
      const m = S.methods.find((x) => x.item === title) || S.methods.find((x) => x.name.toLowerCase() === sheet.toLowerCase());
      if (!m) { problems.push('Sheet "' + sheet + '": no matching assessment method in this course.'); return; }
      // columns -> checkpoint group and criterion
      const byLabel = {};
      rows[idRow].forEach((c, j) => {
        const mm = /^checkpoint=(.*?);\s*(criterion|sub-criterion)=(.*)$/.exec(String(c).trim());
        if (!mm) return;
        const g = byLabel[mm[1]] = byLabel[mm[1]] || { label: mm[1], head: '', cols: [], start: j };
        g.cols.push({ j: j, sub: mm[2] === 'sub-criterion', code: mm[3].trim() });
      });
      Object.values(byLabel).forEach((g) => {
        g.head = String((rows[idRow - 1] || [])[g.start] || '');
        const k = S.cps.find((x) => x.rubric_id === m.rubric_id && norm(x.label) === norm(g.label));
        const inUse = k ? S.inUse[k.checkpoint_id] : null, subs = k ? S.subs[k.checkpoint_id] : [];
        const cols = [];
        g.cols.forEach((c) => {
          if (c.sub) {
            const it = subs.find((x) => x.code === c.code);
            if (it) cols.push(Object.assign(c, { item_id: it.item_id }));
            else problems.push(g.label + ': sub-criterion ' + c.code + ' is not set up for this checkpoint in Arete.');
            return;
          }
          const cr = m.crits.find((x) => x.code === c.code);
          if (!cr) { problems.push(g.label + ': ' + c.code + ' is not in this rubric. Add it in TaeSylla (Rubrics tab) first.'); return; }
          if (inUse && !inUse.some((x) => x.criterion_id === cr.criterion_id)) { problems.push(g.label + ': ' + c.code + ' is not used at this checkpoint.'); return; }
          cols.push(Object.assign(c, { criterion_id: cr.criterion_id }));
        });
        // values
        const out = [], unknown = new Set(), bad = [];
        rows.slice(idRow + 2).forEach((r, i) => {
          const no = String(r[0] || '').trim();
          if (!no && /^(Criterion|Levels)$/i.test(String(r[1] || '').trim())) return;   // the heading rows under the codes
          cols.forEach((c) => {
            const raw = String(r[c.j] || '').trim().toUpperCase();
            if (!raw) return;
            if (!no) { bad.push('row ' + (idRow + 3 + i)); return; }
            if (!known.has(no)) { unknown.add(no); return; }
            const lv = LV[raw];
            if (!lv) { bad.push(no + ' ' + c.code + ' "' + raw + '"'); return; }
            out.push(c.sub ? { item_id: c.item_id, student_no: no, level: lv } : { criterion_id: c.criterion_id, student_no: no, level: lv });
          });
        });
        if (unknown.size) problems.push(g.label + ': student numbers not on the class list: ' + [...unknown].join(', ') + '.');
        if (bad.length) problems.push(g.label + ': values other than E, P, D, NI or N/O: ' + bad.slice(0, 5).join('; ') + (bad.length > 5 ? ' …' : '') + '.');
        if (!out.length) return;   // an empty group is skipped, never wiped
        // compare with what Arete holds
        let added = 0, changed = 0, same = 0, removed = 0;
        if (k) {
          const cur = {};
          Object.keys(S.R).filter((key) => key.startsWith(k.checkpoint_id + '|')).forEach((key) => S.R[key].forEach((x) => { cur[(x.criterion_id ? 'c' + x.criterion_id : 'i' + x.item_id) + '|' + x.student_no] = x.level; }));
          const seen = new Set();
          out.forEach((x) => { const key = (x.criterion_id ? 'c' + x.criterion_id : 'i' + x.item_id) + '|' + x.student_no; seen.add(key); if (!(key in cur)) added++; else if (cur[key] !== x.level) changed++; else same++; });
          removed = Object.keys(cur).filter((key) => !seen.has(key)).length;
        } else added = out.length;
        groups.push({ m: m, k: k, label: g.label, head: g.head, rows: out, codes: cols.filter((c) => !c.sub).map((c) => c.criterion_id),
          added: added, changed: changed, same: same, removed: removed, when: this.parseWhen(g.head, S.o),
          todo: !k || added + changed + removed > 0 });   // a checkpoint already up to date is left alone
      });
    });
    return { groups: groups, problems: problems };
  }

  // "CP2 EDA case-study workshop · Oct 5 & 7 · Lesson 10 · formative" -> dates, kind, reading
  parseWhen(head, o) {
    const M = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
    const d = /\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?\s+(\d{1,2})(?:\s*(?:&|–|-|to)\s*(\d{1,2}))?/i.exec(head || '');
    let from = null, to = null;
    if (d) {
      const mo = M[d[1].toLowerCase().slice(0, 3)], y = Number(o.year) + (o.semester === 'Fall' && mo < 3 ? 1 : 0), pad = (n) => String(n).padStart(2, '0');
      from = y + '-' + pad(mo) + '-' + pad(d[2]); if (d[3]) to = y + '-' + pad(mo) + '-' + pad(d[3]);
    }
    return { from: from, to: to, kind: /summative/i.test(head) ? 'summative' : 'formative', reading: /own reading/i.test(head) ? 'own' : 'progress' };
  }

  upload(S) {
    const db = ARETE.db, imp = this.state.imp;
    this.setState({ imp: Object.assign({}, imp, { stage: 'saving' }) });
    let n = 0, sort = S.cps.reduce((x, k) => Math.max(x, k.sort_order || 0), 0);
    const uploadId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : null;
    const steps = imp.groups.filter((g) => g.todo).map((g) => () => {
      const make = g.k ? Promise.resolve(g.k.checkpoint_id)
        : db.post('outcome_checkpoints', { rubric_id: g.m.rubric_id, offering_id: S.o.offering_id, label: g.label.replace(/^CP\d+\s+/i, '').trim(),
            held_from: g.when.from, held_to: g.when.to, kind: g.when.kind, reading: g.when.reading, sort_order: ++sort })
          .then((rows) => { const id = rows[0].checkpoint_id;
            return db.post('outcome_checkpoint_criteria', g.codes.map((c) => ({ checkpoint_id: id, criterion_id: c }))).then(() => id); });
      return make.then((id) => db.rpc('outcome_upload_checkpoint', Object.assign({ p_checkpoint_id: id, p_rows: g.rows, p_source: 'import' }, uploadId ? { p_upload_id: uploadId } : {})))
        .then((c) => { n += typeof c === 'number' ? c : (c.added || 0) + (c.changed || 0) + (c.removed || 0); });
    });
    steps.reduce((p, f) => p.then(f), Promise.resolve())
      .then(() => { const off = this.state.off; delete this.data[off]; ARETE.course.forget(off); this.cpCount = this.cpCount || {}; this.cpCount[off] = (this.cpCount[off] || 0) + imp.groups.filter((g) => !g.k).length;
        this.setState({ imp: null, reading: null }); })   // the Latest upload panel takes over: what changed, with Undo
      .catch((ex) => this.setState({ imp: Object.assign({}, imp, { stage: 'error', msg: 'Upload stopped: ' + ex.message + '. Checkpoints saved before the error are kept.' }) }));
  }

  undo(fn, args) {
    const off = this.state.off;
    this.setState({ undoMsg: 'Undoing…' });
    ARETE.db.rpc(fn, args)
      .then(() => { delete this.data[off]; ARETE.course.forget(off); this.setState({ undoMsg: '' }); })
      .catch((ex) => this.setState({ undoMsg: ex.message.replace(/^\d+ /, '').replace(/^.*"message":"([^"]+)".*$/, '$1') }));
  }

  recentVals(S) {
    const R = S.recent;
    if (!R || this.state.imp) return null;
    const stu = {}; S.students.forEach((x) => { stu[x.no] = ARETE.who(x.no, x.name); });
    const cpL = {}; S.cps.forEach((k) => { cpL[k.checkpoint_id] = k.label; });
    const code = (h) => { const c = h.criterion_id ? S.critById[h.criterion_id] : null; if (c) return c.code;
      const it = Object.values(S.subs).flat().find((i) => i.item_id === h.item_id); return it ? it.code : '?'; };
    const open = !!this.state.recentOpen, all = !!this.state.recentAll;
    const LV = (l) => l ? l : '—';
    const rows = R.rows.map((h) => ({ cp: cpL[h.checkpoint_id] || '', who: stu[h.student_no] || h.student_no, code: code(h),
      change: LV(h.old_level) + ' → ' + LV(h.new_level), kind: h.old_level == null ? 'added' : h.new_level == null ? 'removed' : 'changed',
      undo: () => this.undo('outcome_undo_change', { p_history_id: h.history_id }) }));
    const n = { added: 0, changed: 0, removed: 0 }; rows.forEach((r) => { n[r.kind]++; });
    const when = new Date(R.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    return { title: 'Latest upload · ' + when, sub: [n.added + ' added', n.changed + ' changed', n.removed + ' removed'].filter((t) => !/^0 /.test(t)).join(' · ') + ' · highlighted in the workbook and below',
      open: open, toggle: () => this.setState({ recentOpen: !open }), toggleLabel: open ? 'Hide changes' : 'Show changes',
      rows: all ? rows : rows.slice(0, 10), more: !all && rows.length > 10 ? 'Show all ' + rows.length : '', showAll: () => this.setState({ recentAll: true }),
      undoAll: () => this.undo('outcome_undo_upload', { p_upload_id: R.id }), msg: this.state.undoMsg || '' };
  }

  importVals(S) {
    const imp = this.state.imp;
    if (!imp) return null;
    const close = () => this.setState({ imp: null });
    const titles = { reading: 'Reading the workbook…', preview: 'Import preview', saving: 'Uploading…', done: 'Import finished', error: 'Import' };
    const groups = (imp.groups || []).map((g) => ({ method: g.m.name, label: g.label,
      status: g.k ? 'Existing checkpoint' : 'New checkpoint · ' + [g.when.from ? g.when.from + (g.when.to ? ' – ' + g.when.to : '') : 'no date', g.when.kind, g.when.reading === 'own' ? 'own reading only' : 'progress'].join(' · '),
      counts: g.rows.length + ' ratings' + (!g.todo ? ' · no changes, skipped' : g.k ? ' · ' + g.added + ' new, ' + g.changed + ' changed, ' + g.same + ' unchanged' + (g.removed ? ', ' + g.removed + ' removed' : '') : ''),
      cs: 'padding: 8px 12px 8px 0; border-bottom: 1px solid #EEEEEE' + (g.todo ? '' : '; color: #9A9A9A') }));
    const todo = (imp.groups || []).filter((g) => g.todo);
    const removed = todo.reduce((s2, g) => s2 + g.removed, 0), total = todo.reduce((s2, g) => s2 + g.rows.length, 0);
    let msg = imp.msg || '';
    if (imp.stage === 'preview' && !groups.length) msg = 'No ratings found in this workbook.';
    else if (imp.stage === 'preview' && !todo.length) msg = 'Everything in this workbook is already in Arete.';
    if (imp.stage === 'preview' && removed) msg = removed + ' ratings now in Arete are empty in the file and will be removed when you upload.';
    return { title: titles[imp.stage], file: imp.file, msg: msg,
      msgStyle: 'margin: 10px 0 0; font-size: 13px; color: ' + (imp.stage === 'error' || removed ? '#8A3A0A' : '#444444'),
      groups: groups, hasGroups: groups.length > 0, problems: imp.problems || [], hasProblems: (imp.problems || []).length > 0,
      canUpload: imp.stage === 'preview' && todo.length > 0, uploadLabel: 'Upload ' + total + ' ratings',
      upload: () => this.upload(S), close: close, closeLabel: imp.stage === 'done' ? 'Close' : 'Cancel' };
  }

  // a peek into the course ratings workbook: Students tab + one tab per method;
  // each checkpoint is a column group (sub-criteria in grey, then the criterion)
  workbook(S, chip, cpWhen) {
    const COL = { E: '#0077B6', P: '#2EA043', D: '#ED7D31', NI: '#C0504D' };
    const SHOW = 7, tab = this.state.wbTab || (S.methods.find((m) => m.cps.length) || S.methods[0] || { rubric_id: 'st' }).rubric_id;
    const base = 'height: 26px; box-sizing: border-box; display: flex; align-items: center; font-size: 11px; white-space: nowrap; overflow: hidden; border-right: 1px solid #E4E4E4; border-bottom: 1px solid #E4E4E4; ';
    const hd = base + 'background: #F5F5F3; color: #444444; ';
    const cells = [], shown = S.students.slice(0, SHOW);
    let grid, note;
    if (tab === 'st') {
      grid = 'display: grid; grid-template-columns: 32px 120px 180px; min-width: 332px';
      ['', 'Student no.', 'Name'].forEach((t) => cells.push({ t: t, s: hd + 'padding: 0 8px; font-weight: 600' }));
      shown.forEach((s, i) => cells.push({ t: String(i + 1), s: hd + 'justify-content: center' }, { t: ARETE.sno(s.no), s: base + 'padding: 0 8px; color: #6B6B6B' }, { t: ARETE.who(s.no, s.name), s: base + 'padding: 0 8px; font-size: 12px' }));
      note = S.students.length + ' students from the course roster';
    } else {
      const m = S.methods.find((x) => x.rubric_id === tab);
      const groups = m.cps.map((k) => {
        const colsK = [];
        S.inUse[k.checkpoint_id].forEach((c) => {
          S.subs[k.checkpoint_id].filter((i) => i.parent_criterion_id === c.criterion_id).forEach((i) => colsK.push({ code: i.code, item: i.item_id, sub: true, tip: i.name + ' (detail of ' + c.code + ')' }));
          colsK.push({ code: c.code, crit: c.criterion_id, tip: c.name });
        });
        return { k: k, cols: colsK, has: Object.keys(S.R).some((key) => key.startsWith(k.checkpoint_id + '|')) };
      });
      const nCols = groups.reduce((s, g) => s + g.cols.length, 0);
      grid = 'display: grid; grid-template-columns: 32px 150px' + (nCols ? ' repeat(' + nCols + ', 30px)' : ' 260px') + '; min-width: ' + (182 + Math.max(nCols * 30, 260)) + 'px';
      if (!nCols) {
        cells.push({ t: '', s: hd }, { t: 'Student', s: hd + 'padding: 0 8px; font-weight: 600' }, { t: 'No checkpoints yet', s: hd + 'padding: 0 8px; color: #9A9A9A' });
        shown.forEach((s, i) => cells.push({ t: String(i + 1), s: hd + 'justify-content: center' }, { t: ARETE.who(s.no, s.name), s: base + 'padding: 0 8px; font-size: 12px' }, { t: '', s: base }));
      } else {
        cells.push({ t: '', s: hd + 'grid-column: span 2' });
        groups.forEach((g) => cells.push({ t: g.k.label + (g.has ? '' : ' · empty'), tip: g.k.label + ' · ' + cpWhen(g.k),
          s: hd + 'grid-column: span ' + g.cols.length + '; padding: 0 8px; font-weight: 600; border-left: 1px solid #9C9C9C; ' + (g.has ? 'background: #2E1648; color: #FFFFFF' : 'color: #9A9A9A') }));
        cells.push({ t: '', s: hd }, { t: 'Student', s: hd + 'padding: 0 8px; font-weight: 600' });
        groups.forEach((g) => g.cols.forEach((c, j) => cells.push({ t: c.code, tip: c.tip,
          s: hd + 'justify-content: center; ' + (j === 0 ? 'border-left: 1px solid #9C9C9C; ' : '') + (c.sub ? 'font-style: italic; color: #8A8A8A; ' : '') + (g.has ? '' : 'color: #B0B0B0') })));
        shown.forEach((s, i) => {
          cells.push({ t: String(i + 1), s: hd + 'justify-content: center' }, { t: ARETE.who(s.no, s.name), s: base + 'padding: 0 8px; font-size: 12px' });
          groups.forEach((g) => {
            const rs = S.R[g.k.checkpoint_id + '|' + s.no] || [];
            g.cols.forEach((c, j) => {
              const r = rs.find((x) => c.sub ? x.item_id === c.item : x.criterion_id === c.crit), l = r && r.level, edge = j === 0 ? 'border-left: 1px solid #9C9C9C; ' : '';
              const hot = S.recentKey[g.k.checkpoint_id + '|' + (c.sub ? 'i' + c.item : 'c' + c.crit) + '|' + s.no];
              const ring = hot ? '; box-shadow: inset 0 0 0 2px #F2B705' : '';
              const tipH = hot ? ' · latest upload: ' + (hot.old_level || '—') + ' → ' + (hot.new_level || '—') : '';
              cells.push(l ? { t: l, tip: ARETE.who(s.no, s.name) + ' · ' + c.code + ' · ' + l + tipH, s: base + edge + 'justify-content: center; font-weight: 600; ' + (COL[l] ? 'color: #FFFFFF; background: ' + COL[l] + (c.sub ? '; opacity: 0.75' : '') : 'color: #8A8A8A; background: #F3F3F3; font-size: 9px') + ring }
                : { t: '', tip: hot ? ARETE.who(s.no, s.name) + ' · ' + c.code + tipH : '', s: base + edge + ring });
            });
          });
        });
      }
      const up = groups.filter((g) => g.has).length;
      note = m.name + ' · ' + (m.cps.length ? up + ' of ' + m.cps.length + (m.cps.length === 1 ? ' checkpoint' : ' checkpoints') + ' uploaded' : 'no checkpoints yet');
    }
    if (S.students.length > SHOW) cells.push({ t: '… ' + (S.students.length - SHOW) + ' more students', s: 'grid-column: 1 / -1; padding: 6px 40px; font-size: 12px; color: #8A8A8A; background: linear-gradient(#FFFFFF, #F7F7F5)' });
    const tabs = [{ id: 'st', t: 'Students' }].concat(S.methods.map((m) => ({ id: m.rubric_id, t: m.name })));
    return { title: S.o.course_id + ' ' + S.term + ' Ratings', grid: grid, cells: cells, note: note,
      tabs: tabs.map((t) => ({ t: t.t, on: tab === t.id, pick: () => this.setState({ wbTab: t.id }),
        s: 'min-height: 34px; padding: 0 14px; border: none; font-family: inherit; font-size: 12px; white-space: nowrap; cursor: pointer; ' +
          (tab === t.id ? 'position: relative; margin-top: -1px; background: #FFFFFF; color: #1D6F42; font-weight: 600; box-shadow: inset 0 -2px 0 #1D6F42, 1px 0 0 #D4D4D4, -1px 0 0 #D4D4D4' : 'background: transparent; color: #444444') })) };
  }
}
return Component;
});

ARETE.page("al1", "AL1 Student", {}, function (DCLogic) {

      .map((g) => ({ t: g.t, on: reading === g.id, s: rBtn(reading === g.id), pick: () => this.setState({ reading: g.id }) }));
    const formative = reading !== 'record' && !(typeof reading === 'number' && (cps.find((k) => k.checkpoint_id === reading) || {}).kind === 'summative');

      const n = { E: 0, P: 0, D: 0, NI: 0 }, below = [];

      const tot = n.E + n.P + n.D + n.NI;

        meta: S.students.length + ' students' + (S.lastDate ? ' · ratings uploaded up to ' + fmtDate(S.lastDate) : ' · no ratings yet') },
      readings: readings, isClo: isClo, isPlo: !isClo, tgClo: isClo ? tgOn : '', tgPlo: isClo ? '' : tgOn,

      defs: defs.map((d) => Object.assign({ titleStyle: isClo ? 'display: none' : 'padding: 9px 12px; font-size: 13px; font-weight: 500; border-bottom: 1px solid #F0ECF5' }, d)),
      defsGrid: 'display: grid; grid-template-columns: 80px ' + (isClo ? '' : '220px ') + '1fr',

ARETE.page("al3", "AL3 Program", {}, function (DCLogic) {
